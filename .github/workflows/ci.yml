name: package-and-demo-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-lock-py312-${{ runner.os == 'Windows' && 'windows' || 'linux' }}.txt
      - name: Install source and test tools
        run: python -m pip install -e ".[platform,science,dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Run offline acceptance tests
        run: python -m pytest -q
      - name: Check standalone demo
        run: python -m polymer_agent_demo.scripts.doctor --stage demo --json
      - name: Build static Pages site
        run: python scripts/build_pages.py
      - name: Build science bundle
        run: python scripts/build_science_core_bundle.py
      - name: Build installable wheel
        run: python -m build --wheel --no-isolation
      - name: Scan the public tree
        run: python scripts/security_scan.py
